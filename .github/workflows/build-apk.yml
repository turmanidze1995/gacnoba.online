name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project from app.zip
        run: unzip -q -o app.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build APK
        run: bash tool/build.sh

      - name: Publish APK to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=${{ github.run_number }}
          printf '{"version_code":%s,"version_name":"Build %s","apk_url":"https://github.com/%s/releases/download/build-%s/app-release.apk","notes":""}' "$N" "$N" "${{ github.repository }}" "$N" > gacnoba_update.json
          gh release create "build-$N" build/app/outputs/flutter-apk/app-release.apk gacnoba_update.json --title "Build $N" --notes "APK"
