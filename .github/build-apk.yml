name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project files
        run: flutter create --platforms=android --org com.gacnoba --project-name gacnoba_messenger .

      - name: Patch Android manifest and SDK version
        run: python3 tool/patch_android.py

      - run: flutter pub get

      - name: Build release APK
        run: >
          flutter build apk --release
          --dart-define=SITE_URL=https://gacnoba.online
          --dart-define=SERVER_KEY=${{ secrets.SERVER_KEY }}
          --dart-define=ONESIGNAL_APP_ID=${{ secrets.ONESIGNAL_APP_ID }}

      - uses: actions/upload-artifact@v4
        with:
          name: gacnoba-messenger-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          
